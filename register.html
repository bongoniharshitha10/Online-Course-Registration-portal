<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            SkillUp Institute
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="courses.html">
                        Courses
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        Contact
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="register.html">
                        Register
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<!-- Page Header -->
<section class="bg-light py-5 text-center">
    <div class="container">
        <h1 class="fw-bold">Student Registration</h1>
        <p class="lead">
            Enroll in your preferred course today
        </p>
    </div>
</section>

<!-- Registration Form -->
<section class="container py-5">

    <!-- Success Alert -->
    <div id="successAlert"
         class="alert alert-success d-none"
         role="alert">
        Registration Successful! We will contact you soon.
    </div>

    <div class="card shadow">

        <div class="card-body p-4">

            <form id="registrationForm">

                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">
                        Student Name
                    </label>

                    <input type="text"
                           class="form-control"
                           required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           required>
                </div>

                <!-- Mobile -->
                <div class="mb-3">
                    <label class="form-label">
                        Mobile Number
                    </label>

                    <input type="tel"
                           class="form-control"
                           required>
                </div>

                <!-- Gender -->
                <div class="mb-3">

                    <label class="form-label d-block">
                        Gender
                    </label>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input"
                               type="radio"
                               name="gender"
                               required>

                        <label class="form-check-label">
                            Male
                        </label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input"
                               type="radio"
                               name="gender">

                        <label class="form-check-label">
                            Female
                        </label>
                    </div>

                </div>

                <!-- Course Selection -->
                <div class="mb-3">

                    <label class="form-label">
                        Select Course
                    </label>

                    <select class="form-select" required>

                        <option value="">
                            Choose Course
                        </option>

                        <option>
                            Web Development
                        </option>

                        <option>
                            Python Programming
                        </option>

                        <option>
                            Data Science
                        </option>

                        <option>
                            AI & Machine Learning
                        </option>

                        <option>
                            Java Programming
                        </option>

                        <option>
                            Cloud Computing
                        </option>

                    </select>

                </div>

                <!-- Qualification -->
                <div class="mb-3">

                    <label class="form-label">
                        Qualification
                    </label>

                    <select class="form-select" required>

                        <option value="">
                            Select Qualification
                        </option>

                        <option>B.Tech</option>
                        <option>B.Sc</option>
                        <option>BCA</option>
                        <option>MCA</option>
                        <option>M.Tech</option>

                    </select>

                </div>

                <!-- Address -->
                <div class="mb-3">

                    <label class="form-label">
                        Address
                    </label>

                    <textarea class="form-control"
                              rows="4"
                              required></textarea>

                </div>

                <!-- Resume Upload -->
                <div class="mb-3">

                    <label class="form-label">
                        Upload Resume
                    </label>

                    <input type="file"
                           class="form-control">

                </div>

                <!-- Terms -->
                <div class="form-check mb-4">

                    <input class="form-check-input"
                           type="checkbox"
                           id="terms"
                           required>

                    <label class="form-check-label"
                           for="terms">

                        I agree to the Terms &
                        Conditions

                    </label>

                </div>

                <!-- Submit -->
                <button type="submit"
                        class="btn btn-primary w-100">

                    Register Now

                </button>

            </form>

        </div>
    </div>

</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-4">

    <h5>SkillUp Institute</h5>

    <p>Hyderabad, Telangana</p>

    <p>+91 9876543210</p>

    <p>info@skillup.com</p>

    <p>Facebook | Instagram | LinkedIn</p>

</footer>

<script>
document.getElementById("registrationForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    document
    .getElementById("successAlert")
    .classList.remove("d-none");

    this.reset();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

});
</script>

<script src="./js/bootstrap.bundle.min.js"></script>

</body>
</html>
